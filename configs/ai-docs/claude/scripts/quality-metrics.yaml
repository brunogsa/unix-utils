# quality-metrics.yaml - metrics that apply per language.
#
# Placement rule: list a check under per_unit only when a
# benchmark on this machine timed it at 8 seconds or less.
# Every other check runs only at batch end.
# Batch end runs every declared metric.
#
# Adding a language is one new entry under `languages`.
# It declares the file extensions it owns and its metrics.
# A metric left out of an entry reads "not applicable", never
# "passed" - say why in a comment beside the entry.
#
# An unknown language or metric name fails the run before any
# measuring starts, naming the entry.
#
# Each metric's entry lands with the module that measures it.
#
# entangled_tests has no script module: the code-reviewer
# metrics lens judges it, so the script skips it on purpose.

# Path prefixes of generated and vendored files, not measured.
excluded_paths:
  - dist/
  - build/
  - coverage/
  - node_modules/
  - vendor/

# Non-code extensions, ignored with no language entry asked.
ignored_extensions: [.md, .txt, .json, .yaml, .yml, .toml]

per_unit: [size, nesting, parameters, cognitive_complexity, code_duplication, test_duplication, dependency_direction]

languages:
  # Dependency direction needs dependency-cruiser for js and ts
  # (ts also needs typescript below 7 beside it), and uv for
  # python's import-linter, and go-arch-lint for go.
  js:
    extensions: [.js, .jsx, .mjs, .cjs]
    metrics: [size, nesting, parameters, cognitive_complexity, crap, coverage, code_duplication, test_duplication, dependency_direction, entangled_tests]
  ts:
    extensions: [.ts, .tsx]
    metrics: [size, nesting, parameters, cognitive_complexity, crap, coverage, code_duplication, test_duplication, dependency_direction, entangled_tests]

  # HTML and CSS have no functions: only size and code
  # duplication apply, the latter from token clones of 4 lines
  # or more.
  #
  # Complexity, nesting and parameters read "not applicable".
  # Duplicated tests read "not applicable": no test-suite
  # structure.
  html:
    extensions: [.html, .htm]
    metrics: [size, code_duplication]
  css:
    extensions: [.css, .scss]
    metrics: [size, code_duplication]
  python:
    extensions: [.py]
    metrics: [size, nesting, parameters, cognitive_complexity, crap, coverage, code_duplication, test_duplication, dependency_direction, entangled_tests]

  # Bash declares size, counted in logical lines, crap, and code
  # duplication, from token clones of 4 lines or more, with
  # coverage opted out.
  #
  # shellmetrics reads Bash functions and shfmt gives each one's
  # end line. lizard reads Bash wrongly, so it is not used.
  #
  # Opt-outs, each reading "not applicable":
  # - coverage: no Bash coverage tool; CRAP uses full coverage.
  # - nesting: shellmetrics does not measure nesting depth.
  # - parameters: Bash has no declared parameter list.
  #
  # - cognitive_complexity: no Bash tool measures it.
  # - dependency direction: Bash has no imports to follow.
  # - duplicated tests: Bash has no test-suite structure.
  # - entangled tests: Bash has no test-suite structure.
  #
  # Complexity joins with its module.
  bash:
    extensions: [.sh, .bash]
    metrics: [size, crap, code_duplication]
  go:
    extensions: [.go]
    metrics: [size, nesting, parameters, cognitive_complexity, crap, coverage, code_duplication, test_duplication, dependency_direction, entangled_tests]
