# quality-metrics-detectors.yaml - repo tools to detect.
#
# A tool is listed in the tool map when one of its config files
# sits at the root of the repo's base ref.
# A config that exists only on the branch is never read, so a
# branch cannot swap in its own measuring tool.
#
# Adding a tool is one new entry: its name, the metric it
# measures (a name from quality-metrics.yaml), the languages it
# measures it for, and its config file names.
#
# A repo tool measures only the languages listed: a Python
# target in a repo with only jest still gets the global tool.

tools:
  - tool: jest
    metric: coverage
    languages: [js, ts]
    configs:
      - jest.config.js
      - jest.config.cjs
      - jest.config.mjs
      - jest.config.ts
      - jest.config.json
  - tool: pytest-cov
    metric: coverage
    languages: [python]
    configs:
      - .coveragerc
  - tool: jscpd
    metric: code_duplication
    languages: [js, ts, python, go, bash, html, css]
    configs:
      - .jscpd.json
  - tool: dependency-cruiser
    metric: dependency_direction
    languages: [js, ts]
    configs:
      - .dependency-cruiser.js
      - .dependency-cruiser.cjs
      - .dependency-cruiser.mjs
  - tool: import-linter
    metric: dependency_direction
    languages: [python]
    configs:
      - .importlinter
