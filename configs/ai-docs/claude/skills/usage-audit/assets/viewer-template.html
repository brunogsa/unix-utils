<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code usage history</title>
<!--
  Template for usage-history/viewer.html. `scripts/build-usage-viewer.py` replaces
  the __USAGE_DATA__ token below with the inlined snapshot + ledger payload.

  The data is INLINED rather than fetched: a page opened over file:// cannot read
  a sibling .json, so fetching would force a local web server just to look at a
  chart. Inlining keeps it a double-click away with zero dependencies.

  Everything here is vanilla JS and hand-rolled SVG for the same reason — a CDN
  chart library is a network request this page must never need.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb;
    --panel: #f9fafb; --main: #2563eb; --sub: #93c5fd; --accent: #b45309;
    --warn: #dc2626; --ok: #059669;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --fg: #e7e9ee; --muted: #9aa1ad; --line: #262b35;
      --panel: #161a21; --main: #60a5fa; --sub: #1e40af; --accent: #f59e0b;
      --warn: #f87171; --ok: #34d399;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px 22px 60px; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 17px; margin: 0 0 2px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .strip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; min-width: 118px;
  }
  .card .k { font-size: 11px; color: var(--muted); text-transform: uppercase;
             letter-spacing: .05em; }
  .card .v { font-size: 18px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
              margin-bottom: 10px; }
  label { font-size: 12px; color: var(--muted); }
  select, button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px;
  }
  button { cursor: pointer; }
  button:hover, button.on { border-color: var(--main); color: var(--main); }
  .chartwrap { border: 1px solid var(--line); border-radius: 8px;
               background: var(--panel); padding: 10px 6px 4px; overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; }
  .bar { cursor: pointer; }
  .bar:hover { opacity: .75; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .axis { fill: var(--muted); font-size: 9px; }
  .selected { stroke: var(--accent); stroke-width: 2; }
  .trend { fill: none; stroke: var(--accent); stroke-width: 2;
           stroke-linejoin: round; stroke-linecap: round; }
  .dot { cursor: pointer; fill: var(--main); }
  .dot:hover { fill: var(--accent); }
  .dot.selected { fill: var(--accent); stroke: var(--fg); stroke-width: 1.5; }
  .fit { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  .r { font-variant-numeric: tabular-nums; color: var(--fg); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .04em; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
          gap: 22px; align-items: start; }
  .empty { color: var(--muted); font-style: italic; }
  .up { color: var(--warn); } .down { color: var(--ok); }
  .tag { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 10px;
         border: 1px solid var(--line); color: var(--muted); margin-right: 4px; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cmt { margin-bottom: 6px; }
  .cmt .s { color: var(--muted); }
  #tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .08s;
    background: var(--fg); color: var(--bg); padding: 6px 9px; border-radius: 6px;
    font-size: 11.5px; max-width: 320px; z-index: 10; white-space: pre-line;
  }
</style>
</head>
<body>

<h1>Claude Code usage history</h1>
<div class="sub" id="range"></div>

<div class="strip" id="totals"></div>

<div class="controls">
  <label for="metric">Metric</label>
  <select id="metric"></select>
  <label for="from">From</label><select id="from"></select>
  <label for="to">To</label><select id="to"></select>
  <button id="reset">Reset range</button>
  <button id="cmp">Compare selected days</button>
  <button id="weekly">Weekly medians</button>
  <button id="trend">Moving average</button>
  <button id="fit">Straight-line trend</button>
  <span class="sub" id="hint" style="margin:0"></span>
</div>

<div class="chartwrap"><svg id="chart" viewBox="0 0 1000 300" preserveAspectRatio="none"></svg></div>

<h2>How two metrics move together</h2>

<div class="controls">
  <label for="xm">X axis</label><select id="xm"></select>
  <label for="ym">Y axis</label><select id="ym"></select>
  <button id="zeros">Include idle days</button>
  <span class="sub r" id="rlabel" style="margin:0"></span>
</div>

<div class="chartwrap"><svg id="scatter" viewBox="0 0 1000 320"></svg></div>

<div id="detail"></div>
<div id="tip"></div>

<script>
const DATA = __USAGE_DATA__;

// Metric accessors. `stack` splits a bar into main/sub; everything else is one bar.
//
// The `d.total`-normalized rows answer "is a
// unit of work getting cheaper?", which a raw
// daily total cannot: spend tracks how much was
// asked for that day, not how efficiently it ran.
//
// `d.total` already carries main + subagent +
// advisor spend, and thinking is billed inside
// `d.tokens.output`, so every row below prices
// the whole day rather than the main loop alone.
//
// The shipped-commit and merged-PR rows go a step
// further. Every other divisor here counts INPUT
// effort, so a fall in cost per message cannot be
// told apart from having asked smaller questions.
//
// Dividing by what shipped measures the output
// instead, which is the only form of the question
// that "am I improving?" has a real answer to.
const METRICS = [
  {id:'cost',      label:'Cost (USD)',            stack:true,  get:d=>d.total,                  fmt:usd},
  {id:'msgs',      label:'User messages',         get:d=>d.kpis.user_messages,                  fmt:num},
  {id:'cpm',       label:'Cost per user message', get:d=>d.kpis.cost_per_user_message,          fmt:usd},
  {id:'cpship',    label:'Cost per shipped commit', get:d=>per(d.total, d.shipped_commits),     fmt:usd, needs:d=>d.shipped_commits},
  {id:'cppr',      label:'Cost per merged PR',    get:d=>per(d.total, d.merged_prs),            fmt:usd, needs:d=>d.merged_prs},
  {id:'shipped',   label:'Shipped commits',       get:d=>d.shipped_commits,                     fmt:num},
  {id:'prs',       label:'Merged PRs',            get:d=>d.merged_prs,                          fmt:num},
  {id:'cpsess',    label:'Cost per session',      get:d=>per(d.total, d.session_count),         fmt:usd},
  {id:'cphour',    label:'Cost per session hour', get:d=>per(d.total, d.kpis.session_hours),    fmt:usd},
  {id:'autonomy',  label:'Autonomous min / user msg', get:autonomousMinutesPerUserMessage,      fmt:n1},
  {id:'outmsg',    label:'Output tokens / user msg', get:d=>per(d.tokens.output, d.kpis.user_messages), fmt:tok},
  {id:'interrupt', label:'Interruptions',         get:d=>d.kpis.interruptions,                  fmt:num},
  {id:'compact',   label:'Compactions',           get:d=>d.compactions,                         fmt:num},
  {id:'hours',     label:'Session hours',         get:d=>d.kpis.session_hours,                  fmt:n1},
  {id:'sessions',  label:'Sessions',              get:d=>d.session_count,                       fmt:num},
  {id:'output',    label:'Output tokens',         get:d=>d.tokens.output,                       fmt:tok},
  {id:'cachew',    label:'Cache-write tokens',    get:d=>d.tokens.cache_write_5m+d.tokens.cache_write_1h, fmt:tok},
  {id:'ttl1h',     label:'1h cache-write share',  get:ttl1h,                                    fmt:pct},
  {id:'hit',       label:'Cache hit rate',        get:d=>d.cache_hit_rate,                      fmt:pct},
  {id:'think',     label:'Thinking block share',  get:d=>d.thinking_block_share,                fmt:pct},
  {id:'subshare',  label:'Subagent share of cost',get:d=>d.total?d.subagent_cost/d.total:0,     fmt:pct},
];

// Every normalized row divides by a count that
// is 0 on an idle day, and a NaN there would
// silently poison the axis scale, the 7-day
// average, and the delta table alike.
function per(value, count) { return count ? value / count : 0; }

// Reported in minutes because the hours form
// rounds the whole series into one bucket: a
// typical day sits near 0.17 h/msg, so a change
// worth acting on disappears at one decimal.
function autonomousMinutesPerUserMessage(d) {
  return per(d.kpis.session_hours * 60, d.kpis.user_messages);
}

function ttl1h(d) {
  const w = d.tokens.cache_write_5m + d.tokens.cache_write_1h;
  return w ? d.tokens.cache_write_1h / w : 0;
}
function usd(v){ return '$' + (v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(v){ return (v||0).toLocaleString('en-US'); }
function n1(v){ return (v||0).toFixed(1); }
function pct(v){ return ((v||0)*100).toFixed(1) + '%'; }
function tok(v){
  if (v >= 1e9) return (v/1e9).toFixed(2)+'B';
  if (v >= 1e6) return (v/1e6).toFixed(1)+'M';
  if (v >= 1e3) return (v/1e3).toFixed(0)+'k';
  return String(v||0);
}

const ALL_DAYS = Object.keys(DATA.days).sort();
const state = {
  metric: 'cost',
  from: ALL_DAYS[0],
  to: ALL_DAYS[ALL_DAYS.length - 1],
  selected: [],   // up to 2 days, in click order — drives detail and compare
  weekly: false,  // one median bar per week, not per day
  trend: true,    // 7-day moving average; see movingAvg()
  fit: true,      // least-squares line; see trendLine()
  xm: 'compact',  // scatter axes — default pair is the one open question 1 asks about
  ym: 'cost',
  zeros: false,   // whether idle days join the correlation; see scatterDays()
};

const $ = id => document.getElementById(id);
const metricDef = () => METRICS.find(m => m.id === state.metric);
const visibleDays = () => ALL_DAYS.filter(d => d >= state.from && d <= state.to);

/* ---------- chart ---------- */

const W = 1000, H = 300, PAD_L = 54, PAD_R = 8, PAD_T = 12, PAD_B = 34;

// Daily spend swings on workload alone — $49.20
// on 2026-07-21 against $291.57 on 2026-07-26 —
// so the bars alone cannot show whether a level
// is moving.
//
// The weekly window is shorter because a week
// already absorbs the weekday cycle the 7-day
// window exists to smooth, and 7 weeks would
// flatten the whole series into one level.
const MA_WINDOW = 7, MA_WEEKS = 3;

// Only a day whose transcripts had not yet aged
// out, whose token counts ccusage confirmed, and
// that had work in it can carry a trend.
//
// The other two kinds are missing data and a
// structural zero, and both bend a trend down
// exactly where the record stops rather than
// where the spending did.
function isCitable(d) {
  return d.coverage === 'complete'
      && recWarn(d) === ''
      && d.session_count > 0;
}

// A cost-per-delivery row divides by something a
// day can legitimately have none of, and per()
// returns 0 there.
//
// That would draw the day that shipped nothing as
// the CHEAPEST one on the chart, inverting what
// the metric means.
//
// So a day without the denominator carries no
// trend, the same treatment a pruned day gets.
// Its bar still draws, because the calendar
// should stay continuous.
function hasDenominator(m, d) {
  return !m.needs || m.needs(d) > 0;
}

// Monday-anchored, and formatted from the local
// getters rather than through toISOString: a UTC
// round-trip shifts the date by one east of
// Greenwich, filing Monday under last week.
function weekStart(day) {
  const t = new Date(day + 'T00:00:00');
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  const month = String(t.getMonth() + 1).padStart(2, '0');
  const date = String(t.getDate()).padStart(2, '0');
  return `${t.getFullYear()}-${month}-${date}`;
}

// The median rather than the mean, because the
// workload spread inside one week reaches 72x —
// a single such day would pull a weekly mean
// above every other day in that week.
function median(values) {
  if (!values.length) return 0;
  const sorted = [...values].sort((a, b) => a - b);
  const mid = sorted.length >> 1;
  return sorted.length % 2
    ? sorted[mid]
    : (sorted[mid - 1] + sorted[mid]) / 2;
}

function weekGroups() {
  const weeks = new Map();
  for (const day of ALL_DAYS) {
    const key = weekStart(day);
    if (!weeks.has(key)) weeks.set(key, []);
    weeks.get(key).push(day);
  }
  return [...weeks];
}

// One entry per bar, built over the FULL series
// and flagged for visibility rather than sliced.
//
// The moving average needs the points before the
// window: recomputing it from the visible range
// restarts it on a partial window and invents a
// rising left edge that is only fewer terms.
function chartPoints(m) {
  const groups = state.weekly
    ? weekGroups()
    : ALL_DAYS.map(day => [day, [day]]);
  return groups.map(([key, days]) => {
    const citableDays = days.filter(day => isCitable(DATA.days[day])
                                        && hasDenominator(m, DATA.days[day]));

    // A weekly bar medians only its citable days,
    // so a pruned day shrinks the sample rather
    // than voting $0.00 into the level.
    const sample = state.weekly ? citableDays : days;
    const values = sample.map(day => m.get(DATA.days[day]) || 0);
    return {
      key,
      days,
      citableDays,
      value: state.weekly ? median(values) : (values[0] || 0),
      citable: citableDays.length > 0,
      inRange: days.some(day => day >= state.from && day <= state.to),
    };
  });
}

// A non-citable point contributes nothing to the
// window instead of contributing a zero, and the
// average holds its last value across the gap so
// the line stays continuous over pruned days.
function movingAvg(points, window) {
  const out = new Array(points.length).fill(null);
  const recent = [];
  points.forEach((p, i) => {
    if (p.citable) {
      recent.push(p.value);
      if (recent.length > window) recent.shift();
    }
    if (recent.length) {
      out[i] = recent.reduce((a, b) => a + b, 0) / recent.length;
    }
  });
  return out;
}

// The moving average tracks the local level; a
// straight fit answers the different question of
// which way the whole visible window points.
//
// Fitted against bar position rather than against
// a count of citable points, so a run of pruned
// days still costs the horizontal distance the
// time it covers actually took.
function trendLine(points) {
  const citable = points
    .map((p, i) => ({ i, value: p.value, citable: p.citable }))
    .filter(p => p.citable);
  const fit = pearson(citable.map(p => p.i), citable.map(p => p.value));
  if (!fit) return null;
  return { at: i => fit.my + fit.slope * (i - fit.mx), n: citable.length };
}

function drawChart() {
  const m = metricDef();
  const points = chartPoints(m);
  const visible = points.filter(p => p.inRange);
  const offset = points.indexOf(visible[0]);
  const plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;
  const bw = plotW / Math.max(visible.length, 1);
  const parts = [];

  const ma = state.trend
    ? movingAvg(points, state.weekly ? MA_WEEKS : MA_WINDOW)
    : null;
  const fit = state.fit && visible.length > 1 ? trendLine(visible) : null;

  // The overlays join the scale so a trend running
  // above the tallest bar is drawn rather than
  // clipped off the top of the plot.
  const overlay = [];
  visible.forEach((p, i) => {
    if (ma && ma[offset + i] !== null) overlay.push(ma[offset + i]);
    if (fit) overlay.push(fit.at(i));
  });
  const max = Math.max(...visible.map(p => p.value),
                       ...overlay.filter(v => v > 0), 0) || 1;
  const y = v => PAD_T + plotH - (Math.min(Math.max(v, 0), max) / max) * plotH;

  // Four gridlines is enough to read a magnitude without turning into a table.
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, yy = y(v);
    parts.push(`<line class="grid" x1="${PAD_L}" x2="${W-PAD_R}" y1="${yy}" y2="${yy}"/>`);
    parts.push(`<text class="axis" x="${PAD_L-6}" y="${yy+3}" text-anchor="end">${m.fmt(v)}</text>`);
  }

  visible.forEach((p, i) => {
    const day = state.weekly ? null : p.days[0];
    const d = day ? DATA.days[day] : null;
    const x = PAD_L + i * bw, w = Math.max(bw - 1.5, 1);
    const sel = day && state.selected.includes(day) ? ' selected' : '';

    // A weekly bar has no single day to open, so it
    // carries a tooltip without the click target.
    const ref = day ? ` data-day="${day}"` : '';
    const tip = state.weekly ? tooltipForWeek(p, m) : tooltipFor(day);
    if (m.stack && d && d.total) {
      const hMain = (d.main_cost / max) * plotH, hSub = (d.subagent_cost / max) * plotH;
      parts.push(`<rect class="bar${sel}"${ref} data-tip="${tip}" x="${x}" y="${y(p.value)}" width="${w}" height="${hSub}" fill="var(--sub)"/>`);
      parts.push(`<rect class="bar${sel}"${ref} data-tip="${tip}" x="${x}" y="${y(p.value)+hSub}" width="${w}" height="${hMain}" fill="var(--main)"/>`);
    } else {
      parts.push(`<rect class="bar${sel}"${ref} data-tip="${tip}" x="${x}" y="${y(p.value)}" width="${w}" height="${Math.max(plotH-(y(p.value)-PAD_T),0)}" fill="var(--main)"/>`);
    }
    // A day with config commits gets a marker, so a spend jump can be read
    // against what shipped the day before it.
    const commits = p.days.reduce((t, dd) => t + (DATA.ledger[dd]||[]).length, 0);
    if (commits) {
      parts.push(`<circle class="bar"${ref} data-tip="${tip}" cx="${x+w/2}" cy="${H-PAD_B+8}" r="${Math.min(2.5+commits/8,6)}" fill="var(--accent)"/>`);
    }

    // Label every Nth bar so ticks never collide at 42+ days.
    const step = Math.ceil(visible.length / 14);
    if (i % step === 0) {
      parts.push(`<text class="axis" x="${x+w/2}" y="${H-8}" text-anchor="middle">${p.key.slice(5)}</text>`);
    }
  });

  // Drawn after the bars so the lines read on top
  // of them rather than behind.
  const legend = [];
  if (ma) {
    const pts = visible
      .map((p, i) => [i, ma[offset + i]])
      .filter(([, v]) => v !== null)
      .map(([i, v]) => `${(PAD_L + i*bw + Math.max(bw-1.5,1)/2).toFixed(1)},${y(v).toFixed(1)}`);
    if (pts.length > 1) {
      parts.push(`<polyline class="trend" points="${pts.join(' ')}"/>`);
      const unit = state.weekly ? `${MA_WEEKS}-week` : `${MA_WINDOW}-day`;
      legend.push(`solid: ${unit} moving average`);
    }
  }
  if (fit) {
    const last = visible.length - 1;
    parts.push(`<line class="fit" x1="${PAD_L+bw/2}" y1="${y(fit.at(0))}" x2="${(PAD_L+last*bw+bw/2).toFixed(1)}" y2="${y(fit.at(last))}"/>`);
    legend.push(`dashed: straight-line trend over ${fit.n} citable`);
  }
  if (legend.length) {
    parts.push(`<text class="axis" x="${W-PAD_R}" y="${PAD_T-3}" text-anchor="end" fill="var(--accent)">${legend.join('  ·  ')}</text>`);
  }

  $('chart').innerHTML = parts.join('');
  $('chart').querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mousemove', e => showTip(e, el.dataset.tip));
    el.addEventListener('mouseleave', hideTip);
    if (el.dataset.day) {
      el.addEventListener('click', () => selectDay(el.dataset.day));
    }
  });
}

// Empty when the day's token counts were confirmed by ccusage, an independent
// reader of the same transcripts; otherwise the reason it was not. A day drawn
// with no marking reads as verified, which is exactly how a miscount spreads
// into every later comparison — so a missing block warns rather than passes.
function recWarn(d) {
  const rec = d.reconciliation;
  if (!rec) return 'unverified: predates the ccusage check';
  if (rec.status === 'ok') return '';
  if (rec.status === 'unavailable') return 'unverified: ccusage unavailable';
  return `unverified: token drift ${rec.worst_delta_pct}%`;
}

function tooltipFor(day) {
  const d = DATA.days[day], m = metricDef();
  const commits = DATA.ledger[day] || [];
  let t = `${day}  ·  ${m.label}: ${m.fmt(m.get(d))}`;
  t += `\n${usd(d.total)}  ·  ${d.kpis.user_messages} msgs  ·  ${d.compactions} compactions`;
  if (commits.length) t += `\n${commits.length} config commit(s) — click to see them`;

  // Named "shipped" against the "config commit(s)"
  // line above, which counts this repo's own edits
  // — two different things that would otherwise
  // read as one number split in half.
  if (d.shipped_commits || d.merged_prs) {
    t += `\nshipped ${d.shipped_commits} commit(s)`;
    t += `, ${d.merged_prs} PR(s) merged`;
  }
  if (!hasDenominator(m, d)) {
    t += `\nnothing shipped — no ${m.label.toLowerCase()} to read,`;
    t += ` so this day is left out of both trends`;
  }
  if (d.coverage !== 'complete') t += `\nCOVERAGE: ${d.coverage} — transcripts aged out`;
  const warn = recWarn(d);
  if (warn) t += `\n${warn.toUpperCase()} — do not cite this day's figures`;
  return t.replace(/"/g, '&quot;');
}

// States the citable count rather than implying
// it: a week's median is taken over that subset
// alone, so 2-of-7 and 7-of-7 are very different
// claims wearing the same bar.
function tooltipForWeek(p, m) {
  const spend = p.days.reduce((t, day) => t + DATA.days[day].total, 0);
  const commits = p.days.reduce((t, day) => t + (DATA.ledger[day]||[]).length, 0);
  let t = `week of ${p.key}  ·  median ${m.label}: ${m.fmt(p.value)}`;
  t += `\n${usd(spend)} across ${p.days.length} day(s)`;
  t += `\n${p.citableDays.length} of ${p.days.length} day(s) citable`;
  t += ` — the median and both trends read only those`;
  if (commits) t += `\n${commits} config commit(s) that week`;
  const shipped = p.days.reduce((t, day) => t + DATA.days[day].shipped_commits, 0);
  const prs = p.days.reduce((t, day) => t + DATA.days[day].merged_prs, 0);
  if (shipped || prs) t += `\nshipped ${shipped} commit(s), ${prs} PR(s) merged`;
  return t.replace(/"/g, '&quot;');
}

function showTip(e, text) {
  const tip = $('tip');
  tip.textContent = text.replace(/&quot;/g, '"');
  tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 340) + 'px';
  tip.style.top = (e.clientY + 16) + 'px';
}
function hideTip(){ $('tip').style.opacity = 0; }

/* ---------- correlation scatter ---------- */

const SW = 1000, SH = 320, S_L = 62, S_R = 16, S_T = 16, S_B = 40;

// An idle day sits at the origin of every metric pair, so a run of them drags
// the fit toward the origin and inflates r while saying nothing about how the
// two metrics move together. Days past the retention floor are dropped
// outright rather than optionally: their transcripts are gone, so a near-zero
// reading there is missing data wearing the costume of a quiet day.
function scatterDays() {
  return visibleDays().filter(day => {
    const d = DATA.days[day];
    if (d.coverage !== 'complete') return false;
    return state.zeros || d.session_count > 0;
  });
}

// Pearson r, plus the least-squares slope the fitted line is drawn from.
// Returns null where the number would not mean anything: fewer than three
// days, or a metric that never varies across them.
function pearson(xs, ys) {
  const n = xs.length;
  if (n < 3) return null;
  const mx = xs.reduce((a, b) => a + b, 0) / n;
  const my = ys.reduce((a, b) => a + b, 0) / n;
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) {
    const a = xs[i] - mx, b = ys[i] - my;
    sxy += a * b; sxx += a * a; syy += b * b;
  }
  if (!sxx || !syy) return null;
  return { r: sxy / Math.sqrt(sxx * syy), slope: sxy / sxx, mx, my };
}

function drawScatter() {
  const mX = METRICS.find(m => m.id === state.xm);
  const mY = METRICS.find(m => m.id === state.ym);
  const days = scatterDays();
  const xs = days.map(d => mX.get(DATA.days[d]) || 0);
  const ys = days.map(d => mY.get(DATA.days[d]) || 0);
  const plotW = SW - S_L - S_R, plotH = SH - S_T - S_B;
  const xMax = Math.max(...xs, 0) || 1, yMax = Math.max(...ys, 0) || 1;
  const px = v => S_L + (v / xMax) * plotW;
  const py = v => S_T + plotH - (v / yMax) * plotH;
  const parts = [];

  for (let i = 0; i <= 4; i++) {
    const yy = S_T + plotH - plotH * i / 4;
    parts.push(`<line class="grid" x1="${S_L}" x2="${SW-S_R}" y1="${yy}" y2="${yy}"/>`);
    parts.push(`<text class="axis" x="${S_L-6}" y="${yy+3}" text-anchor="end">${mY.fmt(yMax*i/4)}</text>`);
    parts.push(`<text class="axis" x="${S_L + plotW*i/4}" y="${SH-12}" text-anchor="middle">${mX.fmt(xMax*i/4)}</text>`);
  }

  const fit = pearson(xs, ys);
  if (fit) {
    const yAt = x => fit.my + fit.slope * (x - fit.mx);
    parts.push(`<line class="fit" x1="${px(0)}" y1="${py(yAt(0))}" x2="${px(xMax)}" y2="${py(yAt(xMax))}"/>`);
  }

  days.forEach((day, i) => {
    const sel = state.selected.includes(day) ? ' selected' : '';
    const tip = `${day}\n${mX.label}: ${mX.fmt(xs[i])}\n${mY.label}: ${mY.fmt(ys[i])}`.replace(/"/g, '&quot;');
    parts.push(`<circle class="dot${sel}" data-day="${day}" data-tip="${tip}" cx="${px(xs[i]).toFixed(1)}" cy="${py(ys[i]).toFixed(1)}" r="4.5"/>`);
  });

  $('scatter').innerHTML = parts.join('');
  $('scatter').querySelectorAll('[data-day]').forEach(el => {
    el.addEventListener('click', () => selectDay(el.dataset.day));
    el.addEventListener('mousemove', e => showTip(e, el.dataset.tip));
    el.addEventListener('mouseleave', hideTip);
  });

  // r is stated with its n because a strong r over four days is noise, and with
  // the excluded count because a filtered day leaves no trace on the plot.
  const dropped = visibleDays().length - days.length;
  $('rlabel').textContent = fit
    ? `r = ${fit.r.toFixed(2)} across ${days.length} days${dropped ? `, ${dropped} excluded` : ''} — correlation, not cause`
    : `Too few varying days to correlate (${days.length} plotted)`;
}

/* ---------- selection ---------- */

function selectDay(day) {
  const at = state.selected.indexOf(day);
  if (at >= 0) state.selected.splice(at, 1);
  else {
    state.selected.push(day);
    if (state.selected.length > 2) state.selected.shift();  // keep the last two
  }
  render();
}

/* ---------- detail + compare ---------- */

function kv(k, v) {
  return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`;
}

function tableOf(head, rows) {
  if (!rows.length) return '<p class="empty">none</p>';
  const th = head.map((h, i) => `<th class="${i ? 'n' : ''}">${h}</th>`).join('');
  const tr = rows.map(r => '<tr>' + r.map((c, i) => `<td class="${i ? 'n' : ''}">${c}</td>`).join('') + '</tr>').join('');
  return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
}

function commitsBlock(day) {
  const commits = DATA.ledger[day] || [];
  if (!commits.length) return '<p class="empty">no config commits this day</p>';
  return commits.map(c =>
    `<div class="cmt"><code>${c.sha}</code> ${escape_(c.subject)}<br>` +
    c.surfaces.map(s => `<span class="tag">${escape_(s)}</span>`).join('') + '</div>').join('');
}

function escape_(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// `skills` is a {name: invocations} map, not a list — show the busiest three.
function topSkills(skills) {
  return Object.entries(skills || {})
    .sort((a, b) => b[1] - a[1]).slice(0, 3)
    .map(([k, n]) => n > 1 ? `${k}×${n}` : k).join(', ');
}

function dayDetail(day) {
  const d = DATA.days[day];
  const fam = Object.entries(d.by_family).sort((a,b)=>b[1]-a[1])
    .map(([k,v]) => [k, usd(v), pct(d.total ? v/d.total : 0)]);
  const sub = Object.entries(d.by_subagent_type).sort((a,b)=>b[1].cost-a[1].cost)
    .map(([k,v]) => [k, usd(v.cost), num(v.runs), usd(v.runs ? v.cost/v.runs : 0)]);
  const skill = Object.entries(d.by_skill_marginal).sort((a,b)=>b[1].dedicated_cost-a[1].dedicated_cost)
    .map(([k,v]) => [k, num(v.dedicated_sessions), usd(v.dedicated_cost), num(v.mixed_sessions), usd(v.mixed_cost_estimate)]);
  const sess = d.top_sessions
    .map(s => [escape_(s.title || s.id || '—'), usd(s.cost), n1(s.duration_hours),
               num(s.compactions), num(s.user_messages), num(s.interruptions),
               escape_(topSkills(s.skills)) || '—']);

  const warn = recWarn(d);

  return `
  <h2>${day} ${d.coverage !== 'complete' ? `<span class="up">· coverage: ${d.coverage}</span>` : ''}${warn ? `<span class="up">· ${warn}</span>` : ''}</h2>
  <div class="strip">
    ${kv('Total', usd(d.total))}${kv('Main', usd(d.main_cost))}${kv('Subagents', usd(d.subagent_cost))}
    ${kv('User msgs', num(d.kpis.user_messages))}${kv('$/msg', usd(d.kpis.cost_per_user_message))}
    ${kv('Interruptions', num(d.kpis.interruptions))}${kv('Compactions', num(d.compactions))}
    ${kv('Session hours', n1(d.kpis.session_hours))}${kv('Cache hit', pct(d.cache_hit_rate))}
    ${kv('1h cache-write', pct(ttl1h(d)))}${kv('Thinking blocks', pct(d.thinking_block_share))}
  </div>
  <div class="cols">
    <div><h2>By model family</h2>${tableOf(['Family','Cost','Share'], fam)}</div>
    <div><h2>By subagent type</h2>${tableOf(['Type','Cost','Runs','$/run'], sub)}</div>
    <div><h2>Config commits</h2>${commitsBlock(day)}</div>
    <div><h2>By skill (marginal)</h2>${tableOf(['Skill','Dedic.','Dedic. $','Mixed','Mixed $'], skill)}</div>
  </div>
  <h2>Top sessions</h2>${tableOf(['Session','Cost','Hours','Compact.','Msgs','Interrupt.','Skills'], sess)}`;
}

function compare(a, b) {
  const [x, y] = [DATA.days[a], DATA.days[b]];
  const rows = METRICS.map(m => {
    const va = m.get(x), vb = m.get(y);
    const delta = vb - va;
    const rel = va ? (delta / va) * 100 : 0;
    const cls = Math.abs(rel) < 0.05 ? '' : (delta > 0 ? 'up' : 'down');
    return [m.label, m.fmt(va), m.fmt(vb),
            `<span class="${cls}">${delta > 0 ? '+' : ''}${m.fmt(delta)}</span>`,
            `<span class="${cls}">${va ? (rel>0?'+':'') + rel.toFixed(1)+'%' : '—'}</span>`];
  });
  // Commits BETWEEN the two days are the candidate causes of the delta.
  const between = ALL_DAYS.filter(d => d > a && d <= b && (DATA.ledger[d]||[]).length);
  const causes = between.length
    ? between.map(d => `<h2>${d}</h2>${commitsBlock(d)}`).join('')
    : '<p class="empty">no config commits landed between these days</p>';
  // A delta IS a citation, so an unverified endpoint has to be visible here and
  // not only in that day's own panel — the table below reads as fact otherwise.
  const unverified = [a, b].filter(d => recWarn(DATA.days[d]));
  const flag = unverified.length
    ? `<p class="up">unverified: ${unverified.join(', ')} — this delta is not citable</p>`
    : '';
  return `<h2>${a} → ${b}</h2>${flag}${tableOf(['Metric', a, b, 'Delta', 'Rel'], rows)}
          <h2>Config changes in between</h2>${causes}`;
}

/* ---------- render ---------- */

function render() {
  const days = visibleDays();
  const sum = k => days.reduce((t, d) => t + k(DATA.days[d]), 0);
  const total = sum(d => d.total), msgs = sum(d => d.kpis.user_messages);

  $('range').textContent =
    `${ALL_DAYS[0]} → ${ALL_DAYS[ALL_DAYS.length-1]} · ${ALL_DAYS.length} closed days · ` +
    `generated ${DATA.meta.generated_at} · one snapshot per closed LOCAL day`;

  $('totals').innerHTML =
    kv('Days shown', num(days.length)) +
    kv('Citable days', num(days.filter(d => isCitable(DATA.days[d])).length)) +
    kv('Total', usd(total)) +
    kv('Mean / day', usd(days.length ? total / days.length : 0)) +
    kv('Peak day', usd(Math.max(...days.map(d => DATA.days[d].total), 0))) +
    kv('User msgs', num(msgs)) +
    kv('$ / msg', usd(msgs ? total / msgs : 0)) +
    kv('Compactions', num(sum(d => d.compactions))) +
    kv('Config commits', num(days.reduce((t, d) => t + (DATA.ledger[d]||[]).length, 0)));

  $('hint').textContent = state.weekly
    ? 'Weekly bars are medians — switch back to daily to inspect a day.'
    : state.selected.length === 0
    ? 'Click a bar to inspect a day; click a second to compare.'
    : state.selected.length === 1
      ? `Selected ${state.selected[0]} — click another day to compare.`
      : `Comparing ${state.selected[0]} → ${state.selected[1]}.`;

  drawChart();
  drawScatter();

  if (state.selected.length === 2) {
    const [a, b] = [...state.selected].sort();
    $('detail').innerHTML = compare(a, b) + dayDetail(b);
  } else if (state.selected.length === 1) {
    $('detail').innerHTML = dayDetail(state.selected[0]);
  } else {
    $('detail').innerHTML = '';
  }
}

/* ---------- wiring ---------- */

$('metric').innerHTML = METRICS.map(m => `<option value="${m.id}">${m.label}</option>`).join('');
$('metric').value = state.metric;
$('metric').addEventListener('change', e => { state.metric = e.target.value; render(); });

for (const id of ['from', 'to']) {
  $(id).innerHTML = ALL_DAYS.map(d => `<option value="${d}">${d}</option>`).join('');
  $(id).value = state[id];
  $(id).addEventListener('change', e => {
    state[id] = e.target.value;
    if (state.from > state.to) state[id === 'from' ? 'to' : 'from'] = e.target.value;
    $('from').value = state.from; $('to').value = state.to;
    render();
  });
}

$('reset').addEventListener('click', () => {
  state.from = ALL_DAYS[0]; state.to = ALL_DAYS[ALL_DAYS.length-1]; state.selected = [];
  $('from').value = state.from; $('to').value = state.to;
  render();
});

$('cmp').addEventListener('click', () => {
  // Default comparison is the two most recent days, the question an audit asks first.
  if (state.selected.length < 2) state.selected = ALL_DAYS.slice(-2);
  render();
});

for (const [id, key] of [['weekly', 'weekly'], ['trend', 'trend'],
                         ['fit', 'fit'], ['zeros', 'zeros']]) {
  $(id).classList.toggle('on', state[key]);
  $(id).addEventListener('click', () => {
    state[key] = !state[key];
    $(id).classList.toggle('on', state[key]);
    render();
  });
}

for (const id of ['xm', 'ym']) {
  $(id).innerHTML = METRICS.map(m => `<option value="${m.id}">${m.label}</option>`).join('');
  $(id).value = state[id];
  $(id).addEventListener('change', e => { state[id] = e.target.value; render(); });
}

render();
</script>
</body>
</html>
