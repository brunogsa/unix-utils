<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session Audit</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #dddddd;
    --card-bg: #f7f7f8;
    --accent: #4c78a8;
    --accent-2: #f58518;
    --track-bg: #e5e5e5;
    --incomplete-bg: #fdecea;
    --incomplete-border: #f5c2c0;
    --incomplete-fg: #7a1f1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8e8e8;
      --muted: #9a9ea6;
      --border: #33363c;
      --card-bg: #1e2126;
      --accent: #7aa6d6;
      --accent-2: #f6a352;
      --track-bg: #2a2d33;
      --incomplete-bg: #3a1f1f;
      --incomplete-border: #6b2c2c;
      --incomplete-fg: #ffb4b0;
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 2rem auto;
    max-width: 960px;
    padding: 0 1rem;
    line-height: 1.5;
    color: var(--fg);
    background: var(--bg);
  }

  h1 { font-size: 1.6rem; margin-bottom: 1.5rem; }
  h2 {
    font-size: 1.15rem;
    margin-top: 0;
    margin-bottom: 1rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }

  section {
    margin-bottom: 1.75rem;
    padding: 1.25rem 1.5rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  section.incomplete {
    background: var(--incomplete-bg);
    border-color: var(--incomplete-border);
    color: var(--incomplete-fg);
  }
  section.incomplete h2 { border-bottom-color: var(--incomplete-border); }

  .headline { font-weight: 600; margin: 0.75rem 0; }
  .dropped { color: var(--muted); font-style: italic; font-size: 0.85rem; }
  .note { color: var(--muted); font-size: 0.85rem; }

  ul { padding-left: 1.25rem; margin: 0.5rem 0; }
  li { margin-bottom: 0.25rem; word-break: break-word; }

  /* Highlights KPI card grid (gap 7) */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.75rem;
    margin-top: 0.75rem;
  }
  .kpi-tile {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    padding: 0.9rem 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .kpi-value { font-size: 1.4rem; font-weight: 700; }
  .kpi-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* Bar rows: token breakdown, model distribution, subagent types
     (gaps 1, 2, 3) */
  .bar-list { display: flex; flex-direction: column; gap: 0.5rem; margin: 0.75rem 0; }
  .bar-row {
    display: grid;
    grid-template-columns: minmax(120px, 200px) 1fr minmax(90px, auto);
    align-items: center;
    gap: 0.75rem;
  }
  .bar-row-label {
    font-size: 0.85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    display: block;
    height: 0.6rem;
    background: var(--track-bg);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: inherit;
  }
  .bar-row-value {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
  }

  /* Agent-hours-vs-wall-clock parallelism pair */
  .bar-pair {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin: 0.75rem 0;
  }

  /* Stacked bar (main-vs-subagent split, time-bucket partition) */
  .stacked-bar { margin: 0.75rem 0; }
  .stacked-bar svg { display: block; width: 100%; border-radius: 4px; overflow: hidden; }
  .bar-legend {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.25rem;
    margin: 0.6rem 0 0;
    padding: 0;
    font-size: 0.8rem;
  }
  .bar-legend li { display: flex; align-items: center; gap: 0.4rem; margin: 0; }
  .swatch {
    display: inline-block;
    width: 0.75rem;
    height: 0.75rem;
    border-radius: 2px;
    flex: none;
  }

  @media (max-width: 520px) {
    .bar-row { grid-template-columns: 1fr; row-gap: 0.25rem; }
    .bar-row-value { text-align: left; }
  }
</style>
</head>
<body>
__AUDIT_CONTENT__
</body>
</html>
