<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Content Slide</title>
  <style>
    :root {
      --color-background: #FFFFFF;
      --color-text-primary: #1D1D1F;
      --color-text-secondary: #86868B;
      --color-accent: #0071E3;
      --color-divider: #E5E5E7;
      --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Inter', system-ui, sans-serif;
      --font-size-title: 48px;
      --font-size-body: 26px;
      --font-size-caption: 18px;
      --font-weight-semibold: 600;
      --font-weight-regular: 400;
      --space-md: 24px;
      --space-lg: 40px;
      --space-xxl: 80px;
      --margin-slide: 60px;
      --border-radius: 12px;
      --line-height-tight: 1.1;
      --line-height-relaxed: 1.6;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 960px;
      height: 540px;
      background: var(--color-background);
      color: var(--color-text-primary);
      font-family: var(--font-family);
      padding: var(--margin-slide);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    h2 {
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-tight);
      letter-spacing: -0.01em;
      margin-bottom: var(--space-lg);
    }
    
    .row {
      display: flex;
      gap: var(--space-xxl);
      align-items: center;
      height: calc(100% - var(--font-size-title) - var(--space-lg));
    }
    
    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    
    p {
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-regular);
      line-height: var(--line-height-relaxed);
    }
    
    .placeholder {
      background: var(--color-divider);
      border-radius: var(--border-radius);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-secondary);
      font-size: var(--font-size-caption);
    }
  </style>
</head>
<body>
  <h2>Seamless Integration</h2>
  <div class="row">
    <div class="col">
      <p>Connect with your existing tools in minutes, not months.</p>
      <p>Our platform integrates with over 200 enterprise applications out of the box.</p>
      <p>No complex configuration or IT support required.</p>
    </div>
    <div class="col">
      <div class="placeholder">Chart or Image</div>
    </div>
  </div>
</body>
</html>
