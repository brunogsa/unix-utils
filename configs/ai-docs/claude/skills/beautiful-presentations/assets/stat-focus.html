<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stat Focus Slide</title>
  <style>
    :root {
      --color-background: #FFFFFF;
      --color-text-primary: #1D1D1F;
      --color-text-secondary: #86868B;
      --color-accent: #0071E3;
      --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Inter', system-ui, sans-serif;
      --font-size-stat: 120px;
      --font-size-body: 26px;
      --font-weight-bold: 700;
      --font-weight-light: 300;
      --space-md: 24px;
      --line-height-tight: 1.1;
      --line-height-normal: 1.4;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 960px;
      height: 540px;
      background: var(--color-background);
      color: var(--color-text-primary);
      font-family: var(--font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    .stat {
      font-size: var(--font-size-stat);
      font-weight: var(--font-weight-bold);
      line-height: var(--line-height-tight);
      letter-spacing: -0.03em;
      color: var(--color-accent);
      margin-bottom: var(--space-md);
    }
    
    .context {
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-light);
      color: var(--color-text-secondary);
      line-height: var(--line-height-normal);
      max-width: 600px;
    }
  </style>
</head>
<body>
  <div class="stat">87%</div>
  <p class="context">of enterprise customers report significant cost savings within the first quarter</p>
</body>
</html>
