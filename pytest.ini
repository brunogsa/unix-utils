[pytest]
# All three patterns, not a replacement: python_files overrides pytest's
# default matcher rather than extending it, so a bare "*.test.py" would
# silently de-collect the five pre-existing test_*.py suites this repo
# already ships, and dropping *_test.py would silently de-collect any
# suite named that way too.
python_files = *.test.py test_*.py *_test.py

# A hyphenated stem (e.g. runner-config.test.py) is not a valid Python
# module name, so the default "prepend" import mode's dotted-import step
# raises ModuleNotFoundError. importlib mode imports each file by path
# instead, sidestepping the module-name requirement entirely.
addopts = --import-mode=importlib
